[package]
name = "ten-vad-rs"
version = "0.1.6"
edition = "2024"
description = "Rust library for working with the TEN VAD ONNX model."
authors = ["Fu Wang <wangfu91@hotmail.com>"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/wangfu91/ten-vad-rs"
keywords = ["vad", "voice", "audio", "detection", "speech"]
categories = ["multimedia::audio", "science"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
ndarray = "0.17.2"
ort = "2.0.0-rc.12"
rubato = "2.0.0"
thiserror = "2.0.18"
rustfft = "6.4.1"
log = "0.4.29"

[dev-dependencies]
hound = "3.5.1"
cpal = "0.17.3"
anyhow = "1.0.102"
audioadapter-buffers = "3.0.0"

[[example]]
name = "pr_curve"
